<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account - Travel Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../styling/styles.css">
</head>
<body>
  <nav>
    <div class="logo">Travel Explorer</div>
    <ul>
      <li><a href="../index.html">Home</a></li>
      <li><a href="destinations.html">Destinations</a></li>
      <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="login.html">Account</a></li>
    </ul>
  </nav>

  <!-- Page Header -->
  <section class="page-header">
    <div class="container">
      <h1>Account</h1>
      <p>Login or create an account to access exclusive deals</p>
    </div>
  </section>

  <!-- Authentication Forms -->
  <section class="auth-section">
    <div class="container">
      <div class="tabs">
        <button class="tab active" onclick="showTab('login')">Login</button>
        <button class="tab" onclick="showTab('signup')">Sign Up</button>
      </div>
      
      <div class="auth-container">
        <!-- Login Form -->
        <div id="login" class="auth-form active">
          <h2>Sign In</h2>
          <form>
            <div class="form-group">
              <label for="login-email">Email Address</label>
              <input type="email" id="login-email" required>
            </div>
            <div class="form-group">
              <label for="login-password">Password</label>
              <input type="password" id="login-password" required>
            </div>
            <div class="form-group remember-forgot">
              <div>
                <input type="checkbox" id="remember">
                <label for="remember">Remember me</label>
              </div>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <button type="submit" class="primary-btn">Login</button>
          </form>
        </div>
        
        <!-- Signup Form -->
        <div id="signup" class="auth-form">
          <h2>Create Account</h2>
          <form>
            <div class="form-group">
              <label for="signup-name">Full Name</label>
              <input type="text" id="signup-name" required>
            </div>
            <div class="form-group">
              <label for="signup-email">Email Address</label>
              <input type="email" id="signup-email" required>
            </div>
            <div class="form-group">
              <label for="signup-password">Password</label>
              <input type="password" id="signup-password" required>
            </div>
            <div class="form-group">
              <label for="signup-confirm">Confirm Password</label>
              <input type="password" id="signup-confirm" required>
            </div>
            <div class="form-group">
              <input type="checkbox" id="terms" required>
              <label for="terms">I agree to the Terms & Conditions</label>
            </div>
            <button type="submit" class="primary-btn">Create Account</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="footer-bottom">
      <p>&copy; 2025 Travel Explorer. All rights reserved.</p>
    </div>
  </footer>

  <script src="../data/destinationsData.js"></script>
  <script src="../Logic/script.js"></script>
  <script>
    function showTab(tabName) {
      // Hide all forms
      document.querySelectorAll('.auth-form').forEach(form => {
        form.classList.remove('active');
      });
      
      // Deactivate all tabs
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      
      // Show selected form
      document.getElementById(tabName).classList.add('active');
      
      // Activate selected tab
      document.querySelector(`.tab[onclick="showTab('${tabName}')"]`).classList.add('active');
    }
  </script>
</body>
</html>
